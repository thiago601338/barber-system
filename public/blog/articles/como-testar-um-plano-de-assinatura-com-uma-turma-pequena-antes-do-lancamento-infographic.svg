<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2175.8999999999996" viewBox="0 0 1200 2175.8999999999996" role="img" aria-labelledby="title"><title id="title">Como testar um plano de assinatura com uma turma pequena antes do lançamento</title><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2B24" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2l8 4-8 4" fill="none" stroke="#AC492F" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="2175.8999999999996" rx="0" fill="#F7F1E9" stroke="none" /><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2"><tspan x="72" dy="0">GUIA VISUAL</tspan></text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="70" dy="0">Como testar um plano de assinatura com uma</tspan><tspan x="70" dy="59.04">turma pequena antes do lançamento</tspan></text><path d="M114 382.08L114 629.0799999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="379.08" r="43" fill="#AC492F" stroke="none" stroke-width="2"/><text x="88" y="391.08" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">01</tspan></text><rect x="186" y="317.08" width="943" height="220" rx="24" fill="#1D1C24" stroke="#DCCDC0" /><svg x="1062" y="342.08" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#DDC4AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 0 0-14-6L3 7m0-5v5h5M4 14a8 8 0 0 0 14 6l3-3m0 5v-5h-5"/></svg><text x="217" y="374.08" fill="#F7F1E9" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Escolha uma hipótese principal</tspan></text><text x="217" y="412.08" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Defina o que quer testar: cobertura de serviços, quantidade de</tspan><tspan x="217" dy="30.75">usos, conveniência de reserva ou uma faixa de preço.</tspan></text><path d="M114 630.0799999999999L114 877.0799999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="627.0799999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="639.0799999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">02</tspan></text><rect x="186" y="565.0799999999999" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="590.0799999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M2 3h5a5 5 0 0 1 5 2 5 5 0 0 1 5-2h5v16h-5a5 5 0 0 0-5 2 5 5 0 0 0-5-2H2z"/></svg><text x="217" y="622.0799999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Dimensione a capacidade do piloto</tspan></text><text x="217" y="660.0799999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Com quarenta minutos por corte, isso representa 1.600 minutos de</tspan><tspan x="217" dy="30.75">capacidade, além das reservas avulsas.</tspan></text><path d="M114 878.0799999999999L114 1125.08" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="875.0799999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="887.0799999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">03</tspan></text><rect x="186" y="813.0799999999999" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="838.0799999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg><text x="217" y="870.0799999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Faça testes operacionais antes da primeira</tspan><tspan x="217" dy="43.05">venda</tspan></text><text x="217" y="951.1299999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">| Teste | Resultado a conferir |</tspan></text><circle cx="114" cy="1123.08" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="1135.08" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">04</tspan></text><rect x="186" y="1061.08" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="1086.08" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></svg><text x="217" y="1118.08" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Acompanhe mais que vendas</tspan></text><text x="217" y="1156.08" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Registre adesões, uso por ciclo, horários procurados, custos,</tspan><tspan x="217" dy="30.75">dificuldades e pedidos de cancelamento.</tspan></text><rect x="71" y="1309.08" width="1058" height="639.8199999999999" rx="25" fill="#FFFCF8" stroke="#DCCDC0" /><text x="104" y="1357.08" fill="#AC492F" font-size="20" font-weight="700" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1.2"><tspan x="104" dy="0">EXEMPLO HIPOTÉTICO DO ARTIGO</tspan></text><text x="104" y="1410.08" fill="#1D1C24" font-size="34" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="104" dy="0">Simulação hipotética: Capacidade do piloto</tspan></text><rect x="99" y="1452.8999999999999" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1486.8999999999999" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Turma</tspan></text><text x="534" y="1486.8999999999999" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">20 assinantes</tspan></text><rect x="99" y="1551.8999999999999" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1585.8999999999999" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Usos por ciclo</tspan></text><text x="534" y="1585.8999999999999" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">2</tspan></text><rect x="99" y="1650.8999999999999" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1684.8999999999999" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Duração por corte</tspan></text><text x="534" y="1684.8999999999999" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">40 min</tspan></text><rect x="99" y="1749.8999999999999" width="998" height="82" rx="12" fill="#F1E1D4" stroke="none" /><text x="122" y="1783.8999999999999" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Compromisso máximo</tspan></text><text x="534" y="1783.8999999999999" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">1.600 min</tspan></text><text x="103" y="1866.8999999999999" fill="#8B776A" font-size="21" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="103" dy="0">Capacidade precisa ser conferida por faixa; baixa utilização não deve ser premissa</tspan><tspan x="103" dy="25.83">obrigatória.</tspan></text><path d="M73 1978.8999999999999L1130 1978.8999999999999" fill="none" stroke="#DCCDC0" stroke-width="2" stroke-linecap="round" /><text x="72" y="2025.8999999999999" fill="#8B776A" font-size="22" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Síntese editorial. Exemplos numéricos do artigo são hipotéticos; adapte as premissas à sua</tspan><tspan x="72" dy="27.06">operação.</tspan></text><text x="72" y="2095.8999999999996" fill="#8B776A" font-size="19" font-weight="500" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Fonte: processo apresentado no artigo. Não são estatísticas de mercado.</tspan></text></svg>