<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1472.29" viewBox="0 0 1200 1472.29" role="img" aria-labelledby="title"><title id="title">Marketing para barbearia</title><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2B24" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2l8 4-8 4" fill="none" stroke="#AC492F" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="1472.29" rx="0" fill="#F7F1E9" stroke="none" /><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2"><tspan x="72" dy="0">GUIA VISUAL</tspan></text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="70" dy="0">Marketing para barbearia</tspan></text><path d="M114 323.03999999999996L114 577.29" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="320.03999999999996" r="43" fill="#AC492F" stroke="none" stroke-width="2"/><text x="88" y="332.03999999999996" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">01</tspan></text><rect x="186" y="258.03999999999996" width="943" height="227.25" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="283.03999999999996" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m10 14 4-4m-7 7-1 1a5 5 0 0 1-7-7l4-4a5 5 0 0 1 7 0m3 0 1-1a5 5 0 0 1 7 7l-4 4a5 5 0 0 1-7 0"/></svg><text x="217" y="315.03999999999996" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Descreva o objetivo de forma verificável</tspan></text><text x="217" y="353.03999999999996" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Escreva o resultado desejado, o grupo e a janela de</tspan><tspan x="217" dy="30.75">acompanhamento. “Aumentar atendimentos concluídos de novos</tspan><tspan x="217" dy="30.75">clientes nas tardes de terça e quarta” informa mais que “crescer</tspan><tspan x="217" dy="30.75">nas redes”.</tspan></text><path d="M114 578.29L114 825.29" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="575.29" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="587.29" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">02</tspan></text><rect x="186" y="513.29" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="538.29" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M2 3h5a5 5 0 0 1 5 2 5 5 0 0 1 5-2h5v16h-5a5 5 0 0 0-5 2 5 5 0 0 0-5-2H2z"/></svg><text x="217" y="570.29" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Escolha uma proposta que a operação possa</tspan><tspan x="217" dy="43.05">cumprir</tspan></text><text x="217" y="651.3399999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">A recepção deve conseguir explicar a mesma oferta que aparece na</tspan><tspan x="217" dy="30.75">peça, sem corrigir informações durante a conversa.</tspan></text><path d="M114 826.29L114 1073.29" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="823.29" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="835.29" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">03</tspan></text><rect x="186" y="761.29" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="786.29" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg><text x="217" y="818.29" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Monte o orçamento completo</tspan></text><text x="217" y="856.29" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Inclua produção de material, mídia quando houver, benefícios</tspan><tspan x="217" dy="30.75">concedidos e tempo da equipe.</tspan></text><circle cx="114" cy="1071.29" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="1083.29" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">04</tspan></text><rect x="186" y="1009.29" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="1034.29" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></svg><text x="217" y="1066.29" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Organize um teste que permita aprender</tspan></text><text x="217" y="1104.29" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Se trocar público, serviço, preço e canal a cada poucos dias,</tspan><tspan x="217" dy="30.75">será difícil entender o que influenciou as respostas.</tspan></text><path d="M73 1275.29L1130 1275.29" fill="none" stroke="#DCCDC0" stroke-width="2" stroke-linecap="round" /><text x="72" y="1322.29" fill="#8B776A" font-size="22" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Síntese editorial. Exemplos numéricos do artigo são hipotéticos; adapte as premissas à sua</tspan><tspan x="72" dy="27.06">operação.</tspan></text><text x="72" y="1392.29" fill="#8B776A" font-size="19" font-weight="500" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Fonte: processo apresentado no artigo. Não são estatísticas de mercado.</tspan></text></svg>