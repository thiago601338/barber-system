<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1382" viewBox="0 0 1200 1382" role="img" aria-labelledby="title"><title id="title">Como a IA atende no WhatsApp da barbearia</title><rect width="1200" height="1382" fill="#F7F1E9"/><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2">GUIA VISUAL</text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif">Como a IA atende no WhatsApp da</text><text x="70" y="203" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif">barbearia</text><path d="M114 376L114 621" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round"/><circle cx="114" cy="373" r="43" fill="#AC492F"/><text x="114" y="384" text-anchor="middle" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif">01</text><rect x="186" y="311" width="943" height="200" rx="24" fill="#1D1C24" stroke="#DCCDC0"/><text x="217" y="368" fill="#F7F1E9" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">O cliente escreve primeiro</text><text x="217" y="409" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">Pergunta preço, horário, endereço ou forma de pagamento. A IA</text><text x="217" y="441" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">nunca começa a conversa.</text><path d="M114 624L114 869" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round"/><circle cx="114" cy="621" r="43" fill="#1D1C24"/><text x="114" y="632" text-anchor="middle" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif">02</text><rect x="186" y="559" width="943" height="200" rx="24" fill="#FFFCF8" stroke="#DCCDC0"/><text x="217" y="616" fill="#1D1C24" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">A IA consulta o sistema</text><text x="217" y="657" fill="#6F625A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">Serviços, preços, duração e a agenda de cada barbeiro, já</text><text x="217" y="689" fill="#6F625A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">cadastrados no Barber System.</text><path d="M114 872L114 1117" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round"/><circle cx="114" cy="869" r="43" fill="#AC492F"/><text x="114" y="880" text-anchor="middle" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif">03</text><rect x="186" y="807" width="943" height="200" rx="24" fill="#1D1C24" stroke="#DCCDC0"/><text x="217" y="864" fill="#F7F1E9" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Responde com as regras da casa</text><text x="217" y="905" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">Tom de voz, pagamento, atraso e estacionamento seguem as</text><text x="217" y="937" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">instruções que você escreveu.</text><circle cx="114" cy="1117" r="43" fill="#1D1C24"/><text x="114" y="1128" text-anchor="middle" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif">04</text><rect x="186" y="1055" width="943" height="200" rx="24" fill="#FFFCF8" stroke="#DCCDC0"/><text x="217" y="1112" fill="#1D1C24" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Marca o horário ou passa para a equipe</text><text x="217" y="1153" fill="#6F625A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">Ela pode deixar a reserva feita. Se alguém da equipe</text><text x="217" y="1185" fill="#6F625A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">responder, a IA pausa naquela conversa.</text><rect x="72" y="1256" width="1056" height="80" rx="18" fill="#EADBCB"/><text x="104" y="1307" fill="#1D1C24" font-size="25" font-weight="600" font-family="Segoe UI,Arial,sans-serif">A IA só responde quem chamou. Toda conversa fica no painel.</text></svg>