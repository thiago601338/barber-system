<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2169.45" viewBox="0 0 1200 2169.45" role="img" aria-labelledby="title"><title id="title">Quanto desconto cabe no corte? Calcule o limite sem apagar a margem</title><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2B24" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2l8 4-8 4" fill="none" stroke="#AC492F" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="2169.45" rx="0" fill="#F7F1E9" stroke="none" /><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2"><tspan x="72" dy="0">GUIA VISUAL</tspan></text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="70" dy="0">Quanto desconto cabe no corte? Calcule o</tspan><tspan x="70" dy="59.04">limite sem apagar a margem</tspan></text><path d="M114 382.08L114 629.0799999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="379.08" r="43" fill="#AC492F" stroke="none" stroke-width="2"/><text x="88" y="391.08" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">01</tspan></text><rect x="186" y="317.08" width="943" height="220" rx="24" fill="#1D1C24" stroke="#DCCDC0" /><svg x="1062" y="342.08" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#DDC4AE" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 16l4-6 4 2 6-7M17 5h4v4"/></svg><text x="217" y="374.08" fill="#F7F1E9" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Separe custos em reais e percentuais</tspan></text><text x="217" y="412.08" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Taxas, impostos e comissões podem acompanhar o preço ou seguir</tspan><tspan x="217" dy="30.75">outra base, conforme as condições efetivas.</tspan></text><path d="M114 630.0799999999999L114 896.6299999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="627.0799999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="639.0799999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">02</tspan></text><rect x="186" y="565.0799999999999" width="943" height="239.55" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="590.0799999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M2 3h5a5 5 0 0 1 5 2 5 5 0 0 1 5-2h5v16h-5a5 5 0 0 0-5 2 5 5 0 0 0-5-2H2z"/></svg><text x="217" y="622.0799999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Calcule o preço mínimo para a contribuição</tspan><tspan x="217" dy="43.05">desejada</tspan></text><text x="217" y="703.1299999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Exemplo hipotético: um corte usa R$6 de materiais e tem despesas</tspan><tspan x="217" dy="30.75">variáveis proporcionais de 40% do preço, já reunidas segundo as</tspan><tspan x="217" dy="30.75">premissas didáticas.</tspan></text><path d="M114 897.6299999999999L114 1144.6299999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="894.6299999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="906.6299999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">03</tspan></text><rect x="186" y="832.6299999999999" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="857.6299999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg><text x="217" y="889.6299999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Veja o efeito do desconto sobre a</tspan><tspan x="217" dy="43.05">contribuição</tspan></text><text x="217" y="970.6799999999998" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Com preço de R$60 nas mesmas premissas, a contribuição é R$30:</tspan><tspan x="217" dy="30.75">R$60 menos R$24 proporcionais e R$6 de materiais.</tspan></text><circle cx="114" cy="1142.6299999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="1154.6299999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">04</tspan></text><rect x="186" y="1080.6299999999999" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="1105.6299999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></svg><text x="217" y="1137.6299999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Defina a regra do cupom</tspan></text><text x="217" y="1175.6299999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">| Condição | Pergunta antes da divulgação |</tspan></text><rect x="71" y="1328.6299999999999" width="1058" height="613.8199999999999" rx="25" fill="#FFFCF8" stroke="#DCCDC0" /><text x="104" y="1376.6299999999999" fill="#AC492F" font-size="20" font-weight="700" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1.2"><tspan x="104" dy="0">EXEMPLO HIPOTÉTICO DO ARTIGO</tspan></text><text x="104" y="1429.6299999999999" fill="#1D1C24" font-size="34" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="104" dy="0">Simulação hipotética: Efeito do desconto</tspan></text><rect x="99" y="1472.4499999999998" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1506.4499999999998" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Preço inicial</tspan></text><text x="534" y="1506.4499999999998" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">R$60</tspan></text><rect x="99" y="1571.4499999999998" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1605.4499999999998" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Contribuição inicial</tspan></text><text x="534" y="1605.4499999999998" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">R$30</tspan></text><rect x="99" y="1670.4499999999998" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1704.4499999999998" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Preço promocional</tspan></text><text x="534" y="1704.4499999999998" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">R$50</tspan></text><rect x="99" y="1769.4499999999998" width="998" height="82" rx="12" fill="#F1E1D4" stroke="none" /><text x="122" y="1803.4499999999998" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Nova contribuição</tspan></text><text x="534" y="1803.4499999999998" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">R$24</tspan></text><text x="103" y="1886.4499999999998" fill="#8B776A" font-size="21" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="103" dy="0">R$6 em materiais e 40% de despesas proporcionais no exemplo; não são regras universais.</tspan></text><path d="M73 1972.4499999999998L1130 1972.4499999999998" fill="none" stroke="#DCCDC0" stroke-width="2" stroke-linecap="round" /><text x="72" y="2019.4499999999998" fill="#8B776A" font-size="22" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Síntese editorial. Exemplos numéricos do artigo são hipotéticos; adapte as premissas à sua</tspan><tspan x="72" dy="27.06">operação.</tspan></text><text x="72" y="2089.45" fill="#8B776A" font-size="19" font-weight="500" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Fonte: processo apresentado no artigo. Não são estatísticas de mercado.</tspan></text></svg>