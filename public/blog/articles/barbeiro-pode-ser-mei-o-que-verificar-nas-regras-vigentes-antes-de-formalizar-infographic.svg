<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1562.08" viewBox="0 0 1200 1562.08" role="img" aria-labelledby="title"><title id="title">Barbeiro pode ser MEI? O que verificar nas regras vigentes antes de formalizar</title><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2B24" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2l8 4-8 4" fill="none" stroke="#AC492F" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="1562.08" rx="0" fill="#F7F1E9" stroke="none" /><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2"><tspan x="72" dy="0">GUIA VISUAL</tspan></text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="70" dy="0">Barbeiro pode ser MEI? O que verificar nas</tspan><tspan x="70" dy="59.04">regras vigentes antes de formalizar</tspan></text><path d="M114 382.08L114 629.0799999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="379.08" r="43" fill="#AC492F" stroke="none" stroke-width="2"/><text x="88" y="391.08" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">01</tspan></text><rect x="186" y="317.08" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="342.08" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 10 5-10 5L2 8zm-10 9 10 5 10-5m-20 5 10 5 10-5"/></svg><text x="217" y="374.08" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Confira a ocupação na lista oficial</tspan></text><text x="217" y="412.08" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">A lista de atividades com a letra B do Portal do Empreendedor</tspan><tspan x="217" dy="30.75">apresenta barbeiro independente e o código correspondente.</tspan></text><path d="M114 630.0799999999999L114 915.0799999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="627.0799999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="639.0799999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">02</tspan></text><rect x="186" y="565.0799999999999" width="943" height="258" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="590.0799999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M2 3h5a5 5 0 0 1 5 2 5 5 0 0 1 5-2h5v16h-5a5 5 0 0 0-5 2 5 5 0 0 0-5-2H2z"/></svg><text x="217" y="622.0799999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Verifique os demais requisitos do MEI</tspan></text><text x="217" y="660.0799999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Na mesma data de consulta, a página oficial sobre requisitos</tspan><tspan x="217" dy="30.75">antes de se tornar MEI informa limite geral anual de R$ 81 mil,</tspan><tspan x="217" dy="30.75">ajuste proporcional no ano de abertura, contratação de no máximo</tspan><tspan x="217" dy="30.75">um empregado nas condições indicadas e restrições a participação</tspan><tspan x="217" dy="30.75">em outra empresa e filial.</tspan></text><path d="M114 916.0799999999999L114 1163.08" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="913.0799999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="925.0799999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">03</tspan></text><rect x="186" y="851.0799999999999" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="876.0799999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg><text x="217" y="908.0799999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Planeje o acompanhamento do faturamento</tspan></text><text x="217" y="946.0799999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Faturamento, recebimento e lucro são medidas diferentes; não use</tspan><tspan x="217" dy="30.75">apenas o saldo da conta bancária para acompanhar a operação.</tspan></text><circle cx="114" cy="1161.08" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="1173.08" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">04</tspan></text><rect x="186" y="1099.08" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="1124.08" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></svg><text x="217" y="1156.08" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Distinga profissional independente e parceria</tspan></text><text x="217" y="1194.08" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Trabalhar por conta própria, manter uma barbearia e participar</tspan><tspan x="217" dy="30.75">de uma relação de salão parceiro são situações que exigem</tspan><tspan x="217" dy="30.75">análise própria.</tspan></text><path d="M73 1365.08L1130 1365.08" fill="none" stroke="#DCCDC0" stroke-width="2" stroke-linecap="round" /><text x="72" y="1412.08" fill="#8B776A" font-size="22" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Síntese editorial. Exemplos numéricos do artigo são hipotéticos; adapte as premissas à sua</tspan><tspan x="72" dy="27.06">operação.</tspan></text><text x="72" y="1482.08" fill="#8B776A" font-size="19" font-weight="500" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Fonte: processo apresentado no artigo. Não são estatísticas de mercado.</tspan></text></svg>