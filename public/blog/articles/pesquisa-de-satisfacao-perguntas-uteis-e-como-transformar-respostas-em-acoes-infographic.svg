<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1491.84" viewBox="0 0 1200 1491.84" role="img" aria-labelledby="title"><title id="title">Pesquisa de satisfação</title><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2B24" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2l8 4-8 4" fill="none" stroke="#AC492F" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="1491.84" rx="0" fill="#F7F1E9" stroke="none" /><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2"><tspan x="72" dy="0">GUIA VISUAL</tspan></text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="70" dy="0">Pesquisa de satisfação</tspan></text><path d="M114 323.03999999999996L114 589.5899999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="320.03999999999996" r="43" fill="#AC492F" stroke="none" stroke-width="2"/><text x="88" y="332.03999999999996" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">01</tspan></text><rect x="186" y="258.03999999999996" width="943" height="239.55" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="283.03999999999996" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="3"/><path d="M2 20v-2a6 6 0 0 1 12 0v2m2-15a3 3 0 0 1 0 6m2 3a5 5 0 0 1 3 5v1"/></svg><text x="217" y="315.03999999999996" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Escolha poucas perguntas relacionadas à</tspan><tspan x="217" dy="43.05">operação</tspan></text><text x="217" y="396.09" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Inclua aspectos que fazem diferença para a experiência:</tspan><tspan x="217" dy="30.75">facilidade de reservar, respeito ao horário, entendimento do</tspan><tspan x="217" dy="30.75">pedido, resultado e clareza do pagamento.</tspan></text><path d="M114 590.5899999999999L114 837.5899999999999" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="587.5899999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="599.5899999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">02</tspan></text><rect x="186" y="525.5899999999999" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="550.5899999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M2 3h5a5 5 0 0 1 5 2 5 5 0 0 1 5-2h5v16h-5a5 5 0 0 0-5 2 5 5 0 0 0-5-2H2z"/></svg><text x="217" y="582.5899999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Defina momento, canal e frequência</tspan></text><text x="217" y="620.5899999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Escolha um momento em que a pessoa já consiga avaliar o serviço.</tspan></text><path d="M114 838.5899999999999L114 1085.59" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="835.5899999999999" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="847.5899999999999" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">03</tspan></text><rect x="186" y="773.5899999999999" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="798.5899999999999" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg><text x="217" y="830.5899999999999" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Registre quem teve oportunidade de responder</tspan></text><text x="217" y="868.5899999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Se apenas clientes que elogiaram foram convidados, o resultado</tspan><tspan x="217" dy="30.75">tem uma seleção que precisa ser reconhecida.</tspan></text><circle cx="114" cy="1083.59" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="1095.59" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">04</tspan></text><rect x="186" y="1021.5899999999999" width="943" height="227.25" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="1046.59" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></svg><text x="217" y="1078.59" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Transforme comentários em ações observáveis</tspan></text><text x="217" y="1116.59" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Agrupe relatos por assunto e procure exemplos recorrentes.</tspan><tspan x="217" dy="30.75">“Difícil reservar à noite” pede investigação da escala e</tspan><tspan x="217" dy="30.75">disponibilidade. “Não entendi o adicional” pede revisão da</tspan><tspan x="217" dy="30.75">explicação e da cobrança.</tspan></text><path d="M73 1294.84L1130 1294.84" fill="none" stroke="#DCCDC0" stroke-width="2" stroke-linecap="round" /><text x="72" y="1341.84" fill="#8B776A" font-size="22" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Síntese editorial. Exemplos numéricos do artigo são hipotéticos; adapte as premissas à sua</tspan><tspan x="72" dy="27.06">operação.</tspan></text><text x="72" y="1411.84" fill="#8B776A" font-size="19" font-weight="500" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Fonte: processo apresentado no artigo. Não são estatísticas de mercado.</tspan></text></svg>