<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1484.59" viewBox="0 0 1200 1484.59" role="img" aria-labelledby="title"><title id="title">Produtividade do barbeiro</title><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2B24" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2l8 4-8 4" fill="none" stroke="#AC492F" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="1484.59" rx="0" fill="#F7F1E9" stroke="none" /><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2"><tspan x="72" dy="0">GUIA VISUAL</tspan></text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="70" dy="0">Produtividade do barbeiro</tspan></text><path d="M114 323.03999999999996L114 570.04" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="320.03999999999996" r="43" fill="#AC492F" stroke="none" stroke-width="2"/><text x="88" y="332.03999999999996" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">01</tspan></text><rect x="186" y="258.03999999999996" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="283.03999999999996" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4m10-4v4M3 11h18m-14 4h2m4 0h2m-8 3h2"/></svg><text x="217" y="315.03999999999996" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Comece pela capacidade que realmente estava</tspan><tspan x="217" dy="43.05">disponível</tspan></text><text x="217" y="396.09" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Subtraia intervalos e atividades planejadas antes de calcular</tspan><tspan x="217" dy="30.75">minutos disponíveis para atendimento.</tspan></text><path d="M114 571.04L114 818.04" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="568.04" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="580.04" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">02</tspan></text><rect x="186" y="506.03999999999996" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="531.04" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M2 3h5a5 5 0 0 1 5 2 5 5 0 0 1 5-2h5v16h-5a5 5 0 0 0-5 2 5 5 0 0 0-5-2H2z"/></svg><text x="217" y="563.04" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Analise um conjunto pequeno de indicadores</tspan></text><text x="217" y="601.04" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">| Indicador | O que responde | Cuidado na comparação |</tspan></text><path d="M114 819.04L114 1085.59" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="816.04" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="828.04" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">03</tspan></text><rect x="186" y="754.04" width="943" height="239.55" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="779.04" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg><text x="217" y="811.04" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Exemplo: menos clientes não significa menor</tspan><tspan x="217" dy="43.05">resultado</tspan></text><text x="217" y="892.0899999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Ana conclui nove serviços de trinta minutos, com contribuição de</tspan><tspan x="217" dy="30.75">R$25 cada; Bruno faz seis serviços de cinquenta minutos, com</tspan><tspan x="217" dy="30.75">contribuição de R$42 cada.</tspan></text><circle cx="114" cy="1083.59" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="1095.59" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">04</tspan></text><rect x="186" y="1021.5899999999999" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="1046.59" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></svg><text x="217" y="1078.59" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Transforme o diagnóstico em uma mudança</tspan><tspan x="217" dy="43.05">específica</tspan></text><text x="217" y="1159.6399999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Quando a capacidade ficou livre por falta de procura, investigue</tspan><tspan x="217" dy="30.75">distribuição de horários e conveniência para o cliente.</tspan></text><path d="M73 1287.59L1130 1287.59" fill="none" stroke="#DCCDC0" stroke-width="2" stroke-linecap="round" /><text x="72" y="1334.59" fill="#8B776A" font-size="22" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Síntese editorial. Exemplos numéricos do artigo são hipotéticos; adapte as premissas à sua</tspan><tspan x="72" dy="27.06">operação.</tspan></text><text x="72" y="1404.59" fill="#8B776A" font-size="19" font-weight="500" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Fonte: processo apresentado no artigo. Não são estatísticas de mercado.</tspan></text></svg>