<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="2090.8599999999997" viewBox="0 0 1200 2090.8599999999997" role="img" aria-labelledby="title"><title id="title">Custo por minuto de atendimento</title><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2B24" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2l8 4-8 4" fill="none" stroke="#AC492F" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="2090.8599999999997" rx="0" fill="#F7F1E9" stroke="none" /><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2"><tspan x="72" dy="0">GUIA VISUAL</tspan></text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="70" dy="0">Custo por minuto de atendimento</tspan></text><path d="M114 323.03999999999996L114 570.04" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="320.03999999999996" r="43" fill="#AC492F" stroke="none" stroke-width="2"/><text x="88" y="332.03999999999996" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">01</tspan></text><rect x="186" y="258.03999999999996" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="283.03999999999996" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18M7 16l4-6 4 2 6-7M17 5h4v4"/></svg><text x="217" y="315.03999999999996" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Escolha o custo e a capacidade considerados</tspan></text><text x="217" y="353.03999999999996" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Defina quais despesas da estrutura entram: aluguel, serviços</tspan><tspan x="217" dy="30.75">recorrentes, remuneração de gestão e outros valores pertinentes</tspan><tspan x="217" dy="30.75">ao critério gerencial.</tspan></text><path d="M114 571.04L114 818.04" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="568.04" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="580.04" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">02</tspan></text><rect x="186" y="506.03999999999996" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="531.04" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M2 3h5a5 5 0 0 1 5 2 5 5 0 0 1 5-2h5v16h-5a5 5 0 0 0-5 2 5 5 0 0 0-5-2H2z"/></svg><text x="217" y="563.04" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Compare capacidade disponível e realizada</tspan></text><text x="217" y="601.04" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Em uma simulação, as despesas de estrutura consideradas somam</tspan><tspan x="217" dy="30.75">R$9.000 por mês.</tspan></text><path d="M114 819.04L114 1066.04" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="816.04" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="828.04" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">03</tspan></text><rect x="186" y="754.04" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="779.04" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg><text x="217" y="811.04" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Acrescente os custos do procedimento</tspan></text><text x="217" y="849.04" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Suponha que o serviço de quarenta minutos tenha R$18 de</tspan><tspan x="217" dy="30.75">materiais, comissão e outras despesas variáveis consideradas.</tspan></text><circle cx="114" cy="1064.04" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="1076.04" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">04</tspan></text><rect x="186" y="1002.04" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="1027.04" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></svg><text x="217" y="1059.04" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Investigue a origem da diferença</tspan></text><text x="217" y="1097.04" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Se o custo por minuto realizado sobe, confira despesas,</tspan><tspan x="217" dy="30.75">capacidade e procura.</tspan></text><rect x="71" y="1250.04" width="1058" height="613.8199999999999" rx="25" fill="#FFFCF8" stroke="#DCCDC0" /><text x="104" y="1298.04" fill="#AC492F" font-size="20" font-weight="700" font-family="Segoe UI,Arial,sans-serif" letter-spacing="1.2"><tspan x="104" dy="0">EXEMPLO HIPOTÉTICO DO ARTIGO</tspan></text><text x="104" y="1351.04" fill="#1D1C24" font-size="34" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="104" dy="0">Simulação hipotética: Estrutura por minuto</tspan></text><rect x="99" y="1393.86" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1427.86" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Estrutura</tspan></text><text x="534" y="1427.86" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">R$9.000</tspan></text><rect x="99" y="1492.86" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1526.86" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Minutos disponíveis</tspan></text><text x="534" y="1526.86" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">18.000</tspan></text><rect x="99" y="1591.86" width="998" height="82" rx="12" fill="#F7F1E9" stroke="none" /><text x="122" y="1625.86" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Minutos realizados</tspan></text><text x="534" y="1625.86" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">12.000</tspan></text><rect x="99" y="1690.86" width="998" height="82" rx="12" fill="#F1E1D4" stroke="none" /><text x="122" y="1724.86" fill="#8B776A" font-size="21" font-weight="650" font-family="Segoe UI,Arial,sans-serif" ><tspan x="122" dy="0">Custo realizado/min</tspan></text><text x="534" y="1724.86" fill="#1D1C24" font-size="26" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="534" dy="0">R$0,75</tspan></text><text x="103" y="1807.86" fill="#8B776A" font-size="21" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="103" dy="0">Rateio gerencial de estrutura, sem duplicar os custos variáveis do serviço.</tspan></text><path d="M73 1893.86L1130 1893.86" fill="none" stroke="#DCCDC0" stroke-width="2" stroke-linecap="round" /><text x="72" y="1940.86" fill="#8B776A" font-size="22" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Síntese editorial. Exemplos numéricos do artigo são hipotéticos; adapte as premissas à sua</tspan><tspan x="72" dy="27.06">operação.</tspan></text><text x="72" y="2010.86" fill="#8B776A" font-size="19" font-weight="500" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Fonte: processo apresentado no artigo. Não são estatísticas de mercado.</tspan></text></svg>