<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1382" viewBox="0 0 1200 1382" role="img" aria-labelledby="title"><title id="title">Quanto custa cada resposta no WhatsApp</title><rect width="1200" height="1382" fill="#F7F1E9"/><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2">CONTA SIMPLES</text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif">Quanto custa cada resposta no WhatsApp</text><path d="M114 318L114 563" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round"/><circle cx="114" cy="315" r="43" fill="#AC492F"/><text x="114" y="326" text-anchor="middle" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif">01</text><rect x="186" y="253" width="943" height="200" rx="24" fill="#1D1C24" stroke="#DCCDC0"/><text x="217" y="310" fill="#F7F1E9" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Conversa aberta pelo cliente</text><text x="217" y="351" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">Quando o cliente escreve, abre-se uma janela de 24 horas para</text><text x="217" y="383" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">responder.</text><path d="M114 566L114 811" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round"/><circle cx="114" cy="563" r="43" fill="#1D1C24"/><text x="114" y="574" text-anchor="middle" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif">02</text><rect x="186" y="501" width="943" height="200" rx="24" fill="#FFFCF8" stroke="#DCCDC0"/><text x="217" y="558" fill="#1D1C24" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Resposta de atendimento</text><text x="217" y="599" fill="#6F625A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">Dentro dessa janela, cada resposta custa cerca de R$ 0,04 na</text><text x="217" y="631" fill="#6F625A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">conta do WhatsApp da barbearia.</text><path d="M114 814L114 1059" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round"/><circle cx="114" cy="811" r="43" fill="#AC492F"/><text x="114" y="822" text-anchor="middle" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif">03</text><rect x="186" y="749" width="943" height="200" rx="24" fill="#1D1C24" stroke="#DCCDC0"/><text x="217" y="806" fill="#F7F1E9" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Veio de anúncio de clique para o WhatsApp?</text><text x="217" y="847" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">Pelas regras da Meta, as respostas ficam gratuitas por 72</text><text x="217" y="879" fill="#DDC4AE" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">horas para quem chega pelo anúncio.</text><circle cx="114" cy="1059" r="43" fill="#1D1C24"/><text x="114" y="1070" text-anchor="middle" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif">04</text><rect x="186" y="997" width="943" height="200" rx="24" fill="#FFFCF8" stroke="#DCCDC0"/><text x="217" y="1054" fill="#1D1C24" font-size="34" font-weight="700" font-family="Segoe UI,Arial,sans-serif">Sem mensagem de marketing</text><text x="217" y="1095" fill="#6F625A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">A IA não puxa conversa, então não gera mensagens de marketing,</text><text x="217" y="1127" fill="#6F625A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif">que custam bem mais caro.</text><rect x="72" y="1256" width="1056" height="80" rx="18" fill="#EADBCB"/><text x="104" y="1307" fill="#1D1C24" font-size="25" font-weight="600" font-family="Segoe UI,Arial,sans-serif">O custo do modelo de IA é separado das tarifas da Meta.</text></svg>