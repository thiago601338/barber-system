<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1465.04" viewBox="0 0 1200 1465.04" role="img" aria-labelledby="title"><title id="title">Migração de assinaturas</title><defs><filter id="shadow" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3B2B24" flood-opacity=".1"/></filter><marker id="arrow" viewBox="0 0 12 12" refX="9" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 2l8 4-8 4" fill="none" stroke="#AC492F" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1200" height="1465.04" rx="0" fill="#F7F1E9" stroke="none" /><text x="72" y="75" fill="#AC492F" font-size="23" font-weight="750" font-family="Segoe UI,Arial,sans-serif" letter-spacing="2"><tspan x="72" dy="0">GUIA VISUAL</tspan></text><text x="70" y="145" fill="#1D1C24" font-size="48" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="70" dy="0">Migração de assinaturas</tspan></text><path d="M114 323.03999999999996L114 570.04" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="320.03999999999996" r="43" fill="#AC492F" stroke="none" stroke-width="2"/><text x="88" y="332.03999999999996" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">01</tspan></text><rect x="186" y="258.03999999999996" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="283.03999999999996" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10a8 8 0 0 0-14-6L3 7m0-5v5h5M4 14a8 8 0 0 0 14 6l3-3m0 5v-5h-5"/></svg><text x="217" y="315.03999999999996" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Preserve a origem antes de transformar os</tspan><tspan x="217" dy="43.05">dados</tspan></text><text x="217" y="396.09" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Guarde os arquivos exportados e registre de onde vieram, período</tspan><tspan x="217" dy="30.75">e momento da extração.</tspan></text><path d="M114 571.04L114 818.04" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="568.04" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="580.04" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">02</tspan></text><rect x="186" y="506.03999999999996" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="531.04" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v16M2 3h5a5 5 0 0 1 5 2 5 5 0 0 1 5-2h5v16h-5a5 5 0 0 0-5 2 5 5 0 0 0-5-2H2z"/></svg><text x="217" y="563.04" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Capture as condições de cada contrato</tspan></text><text x="217" y="601.04" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Preço, frequência, quantidade de visitas, serviços cobertos e</tspan><tspan x="217" dy="30.75">período precisam ser preservados conforme a evidência</tspan><tspan x="217" dy="30.75">disponível.</tspan></text><path d="M114 819.04L114 1066.04" fill="none" stroke="#DDC4AE" stroke-width="7" stroke-linecap="round" /><circle cx="114" cy="816.04" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="828.04" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">03</tspan></text><rect x="186" y="754.04" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="779.04" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 4v6c0 5-4 8-9 10-5-2-9-5-9-10V6zM8 12l3 3 5-6"/></svg><text x="217" y="811.04" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Reconcilie pagamentos antes de ativar</tspan><tspan x="217" dy="43.05">cobertura</tspan></text><text x="217" y="892.0899999999999" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Um total financeiro pode estar correto e ainda conter vínculos</tspan><tspan x="217" dy="30.75">errados por cliente.</tspan></text><circle cx="114" cy="1064.04" r="43" fill="#1D1C24" stroke="none" stroke-width="2"/><text x="88" y="1076.04" fill="#F7F1E9" font-size="29" font-weight="750" font-family="Segoe UI,Arial,sans-serif" ><tspan x="88" dy="0">04</tspan></text><rect x="186" y="1002.04" width="943" height="220" rx="24" fill="#FFFCF8" stroke="#DCCDC0" /><svg x="1062" y="1027.04" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#AC492F" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m4 12 5 5L20 5"/></svg><text x="217" y="1059.04" fill="#1D1C24" font-size="35" font-weight="700" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Reconstitua saldo por ciclo</tspan></text><text x="217" y="1097.04" fill="#8B776A" font-size="25" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="217" dy="0">Identifique visitas concluídas e reservas ainda válidas, sem</tspan><tspan x="217" dy="30.75">descontar duas vezes a mesma visita.</tspan></text><path d="M73 1268.04L1130 1268.04" fill="none" stroke="#DCCDC0" stroke-width="2" stroke-linecap="round" /><text x="72" y="1315.04" fill="#8B776A" font-size="22" font-weight="450" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Síntese editorial. Exemplos numéricos do artigo são hipotéticos; adapte as premissas à sua</tspan><tspan x="72" dy="27.06">operação.</tspan></text><text x="72" y="1385.04" fill="#8B776A" font-size="19" font-weight="500" font-family="Segoe UI,Arial,sans-serif" ><tspan x="72" dy="0">Fonte: processo apresentado no artigo. Não são estatísticas de mercado.</tspan></text></svg>